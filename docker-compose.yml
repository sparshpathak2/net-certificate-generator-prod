services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  migrate:
    image: ${DOCKERHUB_USER}/net-cert-backend:${BACKEND_TAG}
    build: ./backend
    env_file: .env
    depends_on: [postgres]
    command: npx prisma migrate deploy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  backend:
    image: ${DOCKERHUB_USER}/net-cert-backend:${BACKEND_TAG}
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on: [postgres]
    volumes:
      - backend_uploads:/app/uploads
      - backend_temp:/app/temp
      - backend_generated:/app/generated_certificates
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  frontend:
    image: ${DOCKERHUB_USER}/net-cert-frontend:${FRONTEND_TAG}
    build: ./frontend-nextjs
    restart: unless-stopped
    depends_on: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [backend, frontend]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

volumes:
  postgres_data:
  backend_uploads:
  backend_temp:
  backend_generated:
